# Fully containerised stack: Ollama + Qdrant + FastAPI + web UI (nginx).
#
#   cd docker && docker compose up --build            # http://localhost:8080
#
# Apple Silicon: Docker cannot use the Metal GPU, so generation in the `ollama` container runs on
# CPU. For GPU speed, run Ollama on the host instead (see docker-compose.host-ollama.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up --build

name: fuv-math-rag

x-rag-env: &rag-env
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}

services:
  ollama:
    image: ollama/ollama:0.40.13
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama-init:                       # one-shot: pull models into the volume, then exit
    image: ollama/ollama:0.40.13
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    environment:
      <<: *rag-env
      OLLAMA_HOST: http://ollama:11434
      EXTRA_MODELS: ${EXTRA_MODELS:-}
    volumes: [./ollama-init.sh:/ollama-init.sh:ro]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]             # REST API + dashboard at /dashboard
    volumes: [qdrant_storage:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../source_code
      dockerfile: ../docker/Dockerfile.api
    image: fuv-math-rag-api:latest
    ports: ["8000:8000"]             # Swagger UI at /docs
    environment:
      <<: *rag-env
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      QDRANT_URL: http://qdrant:6333
      TOP_K: ${TOP_K:-5}
      PROMPT_MODE: ${PROMPT_MODE:-strict}
    volumes:
      - ../source_code/data/documents:/app/data/documents:ro
    depends_on:
      qdrant: {condition: service_healthy}
      ollama-init: {condition: service_completed_successfully, required: false}
    restart: unless-stopped

  ui:                                # nginx: static web UI + /api reverse proxy
    build:
      context: ../source_code
      dockerfile: ../docker/Dockerfile.ui
      additional_contexts:
        conf: .                        # docker/ (nginx.conf)
    image: fuv-math-rag-ui:latest
    ports: ["8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  ollama_models:
  qdrant_storage:
